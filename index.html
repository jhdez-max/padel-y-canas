      --amarillo: #b45309;

      --texto: #1e293b;

      --borde: #e2e8f0;

    * {
      box-sizing: border-box;

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--texto);
      background: linear-gradient(135deg, #ecfdf5, #fff, #ecfeff);
    }

      color: white;

      background: linear-gradient(90deg, #065f46, #10b981);
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 42px;
    }

    header p {
      margin: 0;

    }

    main {
      max-width: 1100px;
      margin: auto;

      gap: 25px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .contador {

      padding: 15px;
      text-align: center;
      background: white;
      border: 1px solid var(--borde);
      border-radius: 16px;
      box-shadow: 0 5px 15px #00000010;
    }

    .contador span {
      display: block;
      color: var(--gris);
      font-size: 12px;
      font-weight: bold;
    }

    .contador strong {
      font-size: 30px;
    }

    .leyenda {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .etiqueta {
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .fin-semana {
      color: #047857;
      background: var(--verde-claro);
    }

    .festivo {
      color: var(--amarillo);
      background: var(--amarillo-claro);
    }

      display: none;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
    }

    #mensaje.visible {
      display: block;
    }
