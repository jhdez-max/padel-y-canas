<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pádel & Cañas</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#ecfdf5,#ffffff,#ecfeff);
  color: #1e293b;
}

header {
  background: linear-gradient(90deg,#065f46,#10b981);
  color: white;
  padding: 30px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 42px;
}

header p {
  margin: 8px 0 0;
  font-size: 20px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 25px 18px;
}

.contadores {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.contador {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 16px;
  padding: 15px 25px;
  min-width: 190px;
  text-align: center;
}

.contador span {
  display: block;
  color: #64748b;
  font-size: 12px;
  font-weight: bold;
}

.contador strong {
  font-size: 30px;
}

.leyenda {
  margin-bottom: 18px;
}

.etiqueta {
  display: inline-block;
  padding: 7px 12px;
  margin: 3px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

.fin-semana {
  background: #d1fae5;
  color: #047857;
}

.festivo {
  background: #fef3c7;
  color: #b45309;
}

#calendario {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 14px;
}

.dia {
  min-height: 150px;
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 18px;
  padding: 16px;
  text-align: left;
  cursor: pointer;
}

.dia:hover {
  border-color: #10b981;
  transform: translateY(-2px);
}

.dia.festivo-dia {
  background: #fffbeb;
  border-color: #fcd34d;
}

.nombre-dia {
  font-size: 12px;
  color: #64748b;
  font-weight: bold;
}

.numero {
  font-size: 30px;
  font-weight: 900;
}

.nombre-festivo {
  font-size: 11px;
  color: #b45309;
  font-weight: bold;
  margin-top: 5px;
}

.accion {
  color: #059669;
  font-weight: bold;
  margin-top: 20px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.6);

  align-items: center;
  justify-content: center;

  padding: 16px;
}

.modal.visible {
  display: flex;
}

.ventana {
  width: min(550px,100%);
  background: white;
  border-radius: 22px;
  padding: 24px;
}

.cerrar {
  float: right;
  border: 0;
  background: #f1f5f9;
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
}

input,
select {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
}

.horas {
  display: flex;
  gap: 10px;
}

.horas label {
  flex: 1;
}

.apuntar {
  width: 100%;
  margin-top: 8px;
  padding: 13px;

  background: #059669;
  color: white;

  border: 0;
  border-radius: 12px;

  font-weight: bold;
  cursor: pointer;
}

.info {
  background: #ecfdf5;
  padding: 12px;
  margin-top: 15px;
  border-radius: 12px;
  color: #047857;
}

@media(max-width:760px) {

  #calendario {
    grid-template-columns: repeat(2,1fr);
  }

  header h1 {
    font-size: 34px;
  }
}

@media(max-width:430px) {

  #calendario {
    grid-template-columns: 1fr;
  }

  .horas {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header>

<h1>🎾 Pádel & Cañas 🍻</h1>

<p>Diciembre 2026 · Madrid</p>

</header>


<main>

<div class="contadores">

<div class="contador">

<span>POSIBLES PARTIDOS</span>

<strong>14</strong>

</div>


<div class="contador">

<span>PARTIDOS CERRADOS</span>

<strong>0</strong>

</div>

</div>


<div class="leyenda">

<span class="etiqueta fin-semana">
Viernes · Sábados · Domingos
</span>

<span class="etiqueta festivo">
Festivos Madrid
</span>

</div>


<div id="calendario"></div>

</main>


<div id="modal" class="modal">

<div class="ventana">

<button
class="cerrar"
onclick="cerrarModal()">
✕
</button>


<h2 id="titulo"></h2>


<label>
Modalidad
</label>

<select>

<option>Partido</option>

<option>Pozo</option>

</select>


<input
placeholder="Tu nombre *">


<div class="horas">

<label>

Hora inicio

<input
type="time"
value="19:00">

</label>


<label>

Hora fin

<input
type="time"
value="20:30">

</label>

</div>


<input
placeholder="Club">


<input
placeholder="Quién ha hecho la reserva">
